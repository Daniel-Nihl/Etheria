<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/slate/bootstrap.min.css"
          integrity="sha384-8iuq0iaMHpnH2vSyvZMSIqQuUnQA7QM+f6srIdlgBrTSEyd//AWNMyEaSF2yPzNQ" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="body-login">
<div class="login-container">
    <img src="{{ url_for('static', filename='img/Etheria.png') }}" alt="Logo" class="logo">

    <div class="login-box">
        <h2 class="h2-log">Iniciar sesión</h2>
        <div id="message-area">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <span class="flash-msg {{ category }}">
                    {{ message }}
            </span>
            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

        <form action="{{ url_for('index') }}" method="POST" id="login-form">
            <label for="nombre">Usuario:</label>
            <input type="text" id="nombre" name="nombre" required value="{{ nombre | default('') }}">

            <label for="password">Contraseña:</label>
            <div class="password-field">
                <input type="password" id="password" name="password" required>
                <button type="button" class="toggle-password">👁</button>
            </div>

            <button type="submit">Iniciar sesión</button>
            <p>
                <a class="a-log" href="{{ url_for('register') }}">Registrarse</a>
            </p>
        </form>
    </div>
</div>

<script>
    document.querySelector(".toggle-password").addEventListener("click", function () {
        const passwordInput = document.getElementById("password");
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });

    setTimeout(() => {
        const flashMessages = document.querySelectorAll('.flash-msg');
        flashMessages.forEach(msg => {
            msg.style.transition = 'opacity 1s ease';
            msg.style.opacity = '0';
            setTimeout(() => msg.remove(), 1000);
        });
    }, 3000);
</script>
</body>
</html>
