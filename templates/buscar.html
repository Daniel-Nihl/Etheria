<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/slate/bootstrap.min.css"
          integrity="sha384-8iuq0iaMHpnH2vSyvZMSIqQuUnQA7QM+f6srIdlgBrTSEyd//AWNMyEaSF2yPzNQ"
          crossorigin="anonymous">
</head>
<body class="body">

<header>
    <h1 class="titulo">
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='img/Etheria.png') }}" style="width:100px; height:26px">
        </a>
    </h1>

    <nav class="top-nav">
        <a href="/peliculas">Películas</a>
        <a href="/series">Series</a>
        <a href="/lista">Mi lista</a>
        <a href="/visto">Visto</a>
        <a href="/buscar">Buscar</a>
        <a href="/logout" style="padding-left: 100px">Salir</a>
    </nav>
</header>

<main style="padding: 20px;">
    <input type="text" id="search-input" class="search-bar" placeholder="Buscar media...">
    <div id="media-results" class="media-grid"></div>
</main>

<div id="media-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>

        <div class="modal-left">
            <div class="modal-header">
                <img id="modal-image" src="" alt="Media header">
            </div>
            <div class="modal-body">
                <h3 id="modal-title"></h3>
                <p id="modal-description"></p>

                <div id="season-selector" style="display:none; margin-top:10px;">
                    <select id="season-dropdown"></select>
                </div>
                <div id="season-thumbnail-container" style="display:none; margin-top:10px;">
                    <img id="season-thumbnail" src="" alt="Miniatura temporada"
                         style="max-width:100%; border-radius:8px;">
                </div>

                <div class="modal-buttons" style="margin-top:15px;">
                    <button id="list-btn" class="list-btn">＋ Mi lista</button>
                    <button id="seen-btn" class="seen-btn">👁</button>
                    <button class="play-btn">▶ Reproducir</button>
                </div>
            </div>
        </div>

        <div class="modal-right" id="episodes-container" style="display:none;">
            <h4>Capítulos</h4>
            <div id="episodes-list" class="episodes-list"></div>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById("search-input");
    const mediaResults = document.getElementById("media-results");
    const modal = document.getElementById("media-modal");
    const modalImg = document.getElementById("modal-image");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-description");
    const closeBtn = document.querySelector(".close-btn");
    const seasonSelector = document.getElementById("season-selector");
    const seasonDropdown = document.getElementById("season-dropdown");
    const seasonThumbnailContainer = document.getElementById("season-thumbnail-container");
    const seasonThumbnail = document.getElementById("season-thumbnail");
    const episodesContainer = document.getElementById("episodes-container");
    const episodesList = document.getElementById("episodes-list");
    const listBtn = document.getElementById("list-btn");
    const seenBtn = document.getElementById("seen-btn");
    const modalContent = modal.querySelector(".modal-content");

    let searchTimeout;

    async function fetchMedia(query) {
        try {
            const response = await fetch(`/api/buscar_media?q=${encodeURIComponent(query)}`);
            if (!response.ok) throw new Error("Error en la petición");
            return await response.json();
        } catch (err) {
            console.error(err);
            return [];
        }
    }

    function renderMedia(items) {
        mediaResults.innerHTML = "";

        items.forEach(item => {
            const div = document.createElement("div");
            div.className = "media-item";
            div.innerHTML = `
                <img src="/static/img/${item.imagen}" alt="${item.titulo}" class="thumbnail"
                    data-title="${item.titulo}"
                    data-description="Año: ${item.anio || 'N/D'}
                        ${item.duracion ? ' | Duración: ' + item.duracion + ' min' : ''}
                        ${item.director ? ' | Director: ' + item.director : ''}
                        ${item.showrunner ? ' | Showrunner: ' + item.showrunner : ''}
                        ${item.temporadas ? ' | Temporadas: ' + item.temporadas : ''}"
                    data-type="${item.tipo}"
                    data-image="/static/img/${item.imagen}"
                    ${item.temporadas ? `data-temporadas="${item.temporadas}"` : ''}>
                <h5 style="margin-top:10px;">${item.titulo}</h5>
                <p style="font-size:13px;">${item.anio || ""} ${item.genero ? `• ${item.genero}` : ""}</p>
            `;
            mediaResults.appendChild(div);
        });

        activarModal(); // ✅ ahora sí reactivamos los eventos
    }

    searchInput.addEventListener("input", () => {
        clearTimeout(searchTimeout);
        const query = searchInput.value.trim();
        searchTimeout = setTimeout(async () => {
            if (!query) {
                mediaResults.innerHTML = "";
                return;
            }
            const items = await fetchMedia(query);
            renderMedia(items);
        }, 300);
    });

    function activarModal() {
        document.querySelectorAll(".thumbnail").forEach(img => {
            img.addEventListener("click", async () => {
                const tipo = img.dataset.type;
                const titulo = img.dataset.title;
                const temporadas = img.dataset.temporadas;

                modal.style.display = "flex";
                document.body.style.overflow = "hidden";
                modal.scrollTop = 0;
                modalImg.src = img.dataset.image;
                modalTitle.textContent = titulo;
                modalDesc.textContent = img.dataset.description;

                if (tipo === "serie") {
                    seasonSelector.style.display = "block";
                    seasonDropdown.innerHTML = "";

                    for (let i = 1; i <= parseInt(temporadas); i++) {
                        const option = document.createElement("option");
                        option.value = i;
                        option.textContent = `Temporada ${i}`;
                        seasonDropdown.appendChild(option);
                    }

                    seasonThumbnailContainer.style.display = "none";
                    seasonThumbnail.src = `/static/img/${encodeURIComponent(titulo)}_season1.jpg`;

                    episodesContainer.style.display = "flex";
                    episodesContainer.style.flexDirection = "column";
                    cargarCapitulos(titulo, 1);

                    modalContent.classList.add("series-modal");
                } else {
                    seasonSelector.style.display = "none";
                    seasonThumbnailContainer.style.display = "none";
                    episodesContainer.style.display = "none";
                    modalContent.classList.remove("series-modal");
                }

                try {
                    const resLista = await fetch(`/en_lista/${encodeURIComponent(titulo)}`);
                    const dataLista = await resLista.json();
                    listBtn.classList.toggle("added", dataLista.en_lista);
                    listBtn.textContent = dataLista.en_lista ? "✔ En mi lista" : "＋ Mi lista";
                } catch (err) { console.error(err); }

                try {
                    const resVisto = await fetch(`/en_visto/${encodeURIComponent(titulo)}`);
                    const dataVisto = await resVisto.json();
                    seenBtn.classList.toggle("visto", dataVisto.visto);
                    seenBtn.textContent = dataVisto.visto ? "✅" : "👁";
                } catch (err) { console.error(err); }
            });
        });
    }

    closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
        document.body.style.overflow = "";
    });

    window.addEventListener("click", e => {
        if (e.target === modal) {
            modal.style.display = "none";
            document.body.style.overflow = "";
        }
    });

    seasonDropdown.addEventListener("change", () => {
        const titulo = modalTitle.textContent.trim();
        const temporada = parseInt(seasonDropdown.value);
        seasonThumbnail.src = `/static/img/${encodeURIComponent(titulo)}_season${temporada}.jpg`;
        cargarCapitulos(titulo, temporada);
    });

    function cargarCapitulos(titulo, temporada) {
        episodesList.innerHTML = "";
        const capitulos = 10;

        const safeTitle = titulo
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, "_")
            .toLowerCase();

        const imagenPath = `/static/img/${safeTitle}_season${temporada}.jpg`;

        for (let i = 1; i <= capitulos; i++) {
            const epDiv = document.createElement("div");
            epDiv.classList.add("episode-item");

            const epImg = document.createElement("img");
            epImg.src = imagenPath;
            epImg.onerror = () => { epImg.src = "/static/img/coming_soon.jpg"; };
            epImg.alt = `Capítulo ${i}`;
            epImg.title = `Capítulo ${i}`;

            const epNum = document.createElement("span");
            epNum.textContent = `Cap ${i}`;
            epNum.classList.add("episode-number");

            epDiv.appendChild(epImg);
            epDiv.appendChild(epNum);
            episodesList.appendChild(epDiv);
        }
    }

    listBtn.addEventListener("click", async () => {
        const titulo = modalTitle.textContent.trim();
        const response = await fetch(`/toggle_lista/${encodeURIComponent(titulo)}`, { method: "POST" });
        const data = await response.json();
        listBtn.classList.toggle("added", data.en_lista);
        listBtn.textContent = data.en_lista ? "✔ En mi lista" : "＋ Mi lista";
    });

    seenBtn.addEventListener("click", async () => {
        const titulo = modalTitle.textContent.trim();
        const response = await fetch(`/toggle_visto/${encodeURIComponent(titulo)}`, { method: "POST" });
        const data = await response.json();
        seenBtn.classList.toggle("visto", data.visto);
        seenBtn.textContent = data.visto ? "✅" : "👁";
    });
</script>

</body>
</html>
